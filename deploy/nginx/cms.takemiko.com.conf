# たけるのみこと CMS — nginx 設定（Strapi へのリバースプロキシ）
#
# 配置先: /etc/nginx/sites-available/cms.takemiko.com.conf
#         → /etc/nginx/sites-enabled/ へシンボリックリンク
#
# 証明書は Phase 4 の certbot certonly --standalone で
# takemiko.com と同じ証明書に含めて取得済み（fullchain.pem に SAN として入っている）。
#
# Strapi は 127.0.0.1:1337 にのみバインドし（HOST=127.0.0.1）、
# 外部からは必ずこの nginx を経由させる。

limit_req_zone $binary_remote_addr zone=cms_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name cms.takemiko.com;
    server_tokens off; # nginxのバージョン等を隠す（§INFO-01）
    return 301 https://cms.takemiko.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cms.takemiko.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/takemiko.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/takemiko.com/privkey.pem;

    # fail2ban（deploy/fail2ban/jail.d/takemiko-cms.local）がこのパスを監視する
    access_log /var/log/nginx/cms.takemiko.com.access.log;

    # イラストのアップロードを通すため（デフォルト1MBでは足りない）
    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 管理画面ログイン・認証エンドポイントはブルートフォース対策でレート制限
    # （Strapi 5 の実パスは /admin/login。/admin/auth/login ではない）
    location ~ ^/admin/(login|forgot-password|reset-password|register-admin)$ {
        limit_req zone=cms_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Strapi 管理画面のホットリロード等は使わないが、
        # 将来 WebSocket を使う機能が来ても壊れないよう Upgrade 対応を残す
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
