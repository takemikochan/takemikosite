name: Deploy (Content / 記事更新)
on:
  repository_dispatch:
    types: [cms-update]
  workflow_dispatch:
  schedule:
    - cron: '10 15 * * *' # UTC 15:10 = JST 00:10。予約公開の取りこぼし保険
permissions:
  contents: read
concurrency: { group: deploy-site, cancel-in-progress: false }
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Build
        working-directory: web
        env:
          STRAPI_URL: ${{ secrets.STRAPI_URL }}
          STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID }}
          PUBLIC_CONTACT_ENDPOINT: ${{ secrets.PUBLIC_CONTACT_ENDPOINT }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
        run: pnpm build
      - uses: ./.github/actions/deploy-dist
        with:
          dist-path: web/dist
          ref: ${{ github.sha }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-port: ${{ secrets.SSH_PORT }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy-path: ${{ secrets.DEPLOY_PATH }}
