# たけるのみこと Official Site — nginx 設定（サイト本体）
#
# 配置先: /etc/nginx/sites-available/takemiko.com.conf
#         → /etc/nginx/sites-enabled/ へシンボリックリンク
#
# 証明書は事前に certbot --nginx で発行しておくこと（このファイル内の
# ssl_certificate パスは certbot が自動で書き換える）。
# trailingSlash: 'always'（astro.config.mjs）/ www→apex 301 / site の値を
# 必ず一致させる（§9「ドメイン正規化」対策）。

# --- www は apex へ301（http/https どちらで来ても一旦ここで正規化） ---
server {
    listen 80;
    listen [::]:80;
    server_name www.takemiko.com;
    return 301 https://takemiko.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.takemiko.com;

    ssl_certificate     /etc/letsencrypt/live/takemiko.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/takemiko.com/privkey.pem;

    return 301 https://takemiko.com$request_uri;
}

# --- apex の http は https へ ---
server {
    listen 80;
    listen [::]:80;
    server_name takemiko.com;
    return 301 https://takemiko.com$request_uri;
}

# --- apex 本体 ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name takemiko.com;

    ssl_certificate     /etc/letsencrypt/live/takemiko.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/takemiko.com/privkey.pem;

    root /var/www/takemiko/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /_astro/ {
        # ハッシュ付き資産は永久キャッシュ
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location = /rss.xml {
        add_header Cache-Control "public, max-age=600";
    }
    location = /robots.txt {
        access_log off;
    }
    location / {
        # HTML は常に再検証（CMS更新の反映を即座に効かせるため）
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store";
    }
}
