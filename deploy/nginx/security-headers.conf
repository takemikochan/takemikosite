# サイト本体（takemiko.com）共通セキュリティヘッダー。
# 配置先: /etc/nginx/snippets/security-headers.conf
#
# ⚠️ nginx の add_header は「そのlocationに1つでもadd_headerがあると、
# 上位レベル（server等）のadd_headerを一切継承しない」という仕様があるため、
# add_header を持つ location ブロックすべてでこのファイルを include すること。
# （server レベルに書くだけでは locationブロック側に打ち消される）

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://www.googletagmanager.com https://form.takemiko.workers.dev; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
