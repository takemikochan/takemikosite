name = "form"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# ALLOWED_ORIGIN は公開情報（本番ドメイン）のためここに直接書く。
# TURNSTILE_SECRET / RESEND_API_KEY / CONTACT_NOTIFY_EMAIL は
# `wrangler secret put` で設定する（このファイルには書かない）。
[vars]
ALLOWED_ORIGIN = "https://takemiko.com"

[[d1_databases]]
binding = "DB"
database_name = "takemiko-contact"
database_id = "309b7bbf-b307-4f54-b514-57b035559e45"

# 保持期間を過ぎた問い合わせデータを日次で削除する（§PRIV-01）
[triggers]
crons = ["0 18 * * *"] # UTC 18:00 = JST 03:00
